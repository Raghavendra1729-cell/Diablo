embedding:
  model: "BAAI/bge-small-en-v1.5"
  device: "cpu"                 

chunking:
  chunk_size: 1000                    
  overlap: 200                      

vectordb:
  collection: "sc_portfolio_gpu"
  distance: "cosine"
  score_threshold: 0.45              

retrieval:
  top_k: 4                       

llm:
  model: "MiniMaxAI/MiniMax-M3"
  provider: "huggingface"
  base_url: "https://router.huggingface.co/v1"
  max_tokens: 1500        
  max_tokens_voice: 400    
  temperature: 0.3
  temperature_voice: 0.5
  top_p: 0.9
  max_search_turns: 1      # 1 turn max for fast web response
  history_limit: 8         # lean history to avoid high serverless latency

calendar:
  provider: "calcom"                 
  calcom_base_url: "https://api.cal.com/v2"

persona:
  name: "Linga Seetha Rama Raghavendra's AI Representative"
  data_dir: "data"

server:
  host: "0.0.0.0"
  port: 8000
